name: Test traffic persistence
on:
  push:
    branches: [dev_new, master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GOEXPERIMENT: jsonv2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.0'
      - name: Verify durable collection, outage recovery and controllers
        run: go test -race ./common/counter ./common/trafficqueue ./node
      - name: Verify panel acknowledgements
        run: go test -race ./api/panel -run TestTrafficReportRequiresPanelAcknowledgement
      - name: Verify all supported cores compile
        run: go build -tags "sing xray hysteria2 with_quic with_grpc with_utls with_wireguard with_acme with_gvisor" ./...
      - name: Check installer syntax
        run: bash -n install.sh scripts/V2bX.sh scripts/initconfig.sh
